# Release on a version tag (docs/design/12-web-version.md "Build"; the web accounts design §9.3 and §9.6).
#
#   git tag v0.11.0 && git push origin v0.11.0
#
# 1. `ci`      runs the whole CI workflow (server + Godot tests) for the tagged commit.
# 2. `export`  exports Web, Windows and macOS with the official Godot 4.7.2 export templates (checksum pinned),
#              zips them and writes SHA256SUMS. Read-only token: the exporter runs project code.
# 3. `release` creates the GitHub Release with those files (the only job with `contents: write`).
# 4. `image`   builds the accounts API image (server/) for linux/amd64 and linux/arm64 and pushes it to GHCR
#              (the only job with `packages: write`).
#
# Release assets (deploy/update.sh downloads the web archive and SHA256SUMS and verifies them):
#   QuidditchManager-<tag>-web.zip       contents of export/web/ (index.html, .js, .wasm, .pck, ... plus web_shell/*.js|css)
#   QuidditchManager-<tag>-windows.zip   QuidditchManager.exe (game data embedded)
#   QuidditchManager-<tag>-macos.zip     Quidditch Manager.app (universal, ad-hoc signed, not notarized)
#   SHA256SUMS                           `sha256sum` output for the three archives
# Every archive also carries LICENSE and ATTRIBUTION.md at its root.
# API image: ghcr.io/<owner, lowercase>/quidditch-manager-api:<tag> (and :latest for tags without a "-suffix").
#
# No stored secrets: GitHub creates `github.token` (GITHUB_TOKEN) for each run and it expires with the run.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"
  # SHA-512 values copied from the official SHA512-SUMS.txt of
  # https://github.com/godotengine/godot/releases/tag/4.7.2-stable. Update them together with GODOT_VERSION
  # (and the same value in ci.yml).
  GODOT_LINUX_SHA512: "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65"
  GODOT_TEMPLATES_SHA512: "ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079"

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  export:
    name: Export Web, Windows and macOS
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag must match the version baked into the builds (export_presets.cfg). A "-suffix" (v1.2.0-rc1) is
      # ignored for the comparison.
      - name: Check the tag against export_presets.cfg
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          tag_version="${tag_version%%-*}"
          preset_version="$(sed -n 's/^application\/short_version="\(.*\)"$/\1/p' export_presets.cfg | head -n1)"
          echo "tag: $GITHUB_REF_NAME  export_presets.cfg: $preset_version"
          if [ "$tag_version" != "$preset_version" ]; then
            echo "::error file=export_presets.cfg::application/short_version is \"$preset_version\" but the tag is $GITHUB_REF_NAME. Bump the version in export_presets.cfg (all presets) and application/config/version in project.godot before tagging."
            exit 1
          fi

      - name: Install Godot ${{ env.GODOT_VERSION }} and its export templates (checksums verified)
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          templates="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$editor" "$base/$editor"
          curl -fsSL --retry 3 -o "$templates" "$base/$templates"
          printf '%s  %s\n%s  %s\n' "$GODOT_LINUX_SHA512" "$editor" "$GODOT_TEMPLATES_SHA512" "$templates" | sha512sum -c -
          mkdir -p godot
          unzip -q "$editor" -d godot
          mv "godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot/godot
          chmod +x godot/godot
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          # Only the templates the three presets use (the full archive is about 1.3 GB). unzip fails if a name
          # is missing, so a renamed template breaks the release loudly.
          unzip -q "$templates" \
            templates/version.txt \
            templates/web_nothreads_release.zip \
            templates/windows_release_x86_64.exe \
            templates/macos.zip \
            -d tpl
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          rm -rf "$editor" "$templates" tpl

      # Cold import on purpose (no cache in the release build). Also compiles the .translation files.
      - name: Import the project
        run: godot --headless --path . --import

      - name: Export
        run: |
          set -euo pipefail
          mkdir -p export/web export/windows "$RUNNER_TEMP/dist"
          godot --headless --path . --export-release "Web" export/web/index.html
          godot --headless --path . --export-release "Windows" export/windows/QuidditchManager.exe
          # macOS as a .zip: the DMG layout of tools/make_dmg.sh needs hdiutil and Finder (a Mac host).
          godot --headless --path . --export-release "macOS" "$RUNNER_TEMP/dist/QuidditchManager-${GITHUB_REF_NAME}-macos.zip"
          for f in export/web/index.html export/web/index.wasm export/web/index.pck \
                   export/windows/QuidditchManager.exe "$RUNNER_TEMP/dist/QuidditchManager-${GITHUB_REF_NAME}-macos.zip"; do
            if [ ! -s "$f" ]; then echo "::error::export output missing or empty: $f"; exit 1; fi
          done

      # The custom web shell (web_shell/, design §3.3) loads external scripts/styles that Godot does not copy.
      - name: Package
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in web_shell/*.js web_shell/*.css; do cp -v "$f" export/web/; done
          dist="$RUNNER_TEMP/dist"
          (cd export/web && zip -q -r -9 -X "$dist/QuidditchManager-${GITHUB_REF_NAME}-web.zip" .)
          (cd export/windows && zip -q -9 -X "$dist/QuidditchManager-${GITHUB_REF_NAME}-windows.zip" QuidditchManager.exe)
          # The license texts go into every archive (at the root: -j drops the directory part).
          for z in "$dist"/QuidditchManager-"${GITHUB_REF_NAME}"-{web,windows,macos}.zip; do
            zip -q -9 -X -j "$z" LICENSE ATTRIBUTION.md
          done
          (cd "$dist" && sha256sum -- *.zip > SHA256SUMS && cat SHA256SUMS && ls -l)

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: GitHub Release
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Quidditch Manager $GITHUB_REF_NAME" \
            --generate-notes \
            "${flags[@]}"

  image:
    name: API image (GHCR)
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name and tags
        id: meta
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quidditch-manager-api"
          tags="$image:$GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in *-*) ;; *) tags="$tags,$image:latest" ;; esac
          {
            echo "image=$image"
            echo "tags=$tags"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 builds)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The repository root, because the image generates its web strings from locale/strings.csv next to server/.
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=quidditch-manager-api
            org.opencontainers.image.description=Accounts service for the browser build of Quidditch Manager
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.description=Accounts service for the browser build of Quidditch Manager
            index:org.opencontainers.image.licenses=MIT
