# Continuous integration (docs/design/12-web-version.md step 4; the web accounts design §9.6).
#
# - `server`: the accounts API in server/ (typecheck, unit tests, integration tests against a throwaway
#   Postgres service container, and a Docker build of the API image that is never pushed).
# - `godot`: the game's test suite with headless Godot 4.7.2 (official build, checksum pinned below).
#
# Public-repo rules (docs/design/12, "Repository hygiene"): no secrets anywhere, triggered by push to main and
# `pull_request` (never `pull_request_target`), read-only token, every action pinned to a full commit SHA
# (the trailing `# vX.Y.Z` comment lets Dependabot bump the pin). release.yml reuses this workflow through `workflow_call`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: "4.7.2"
  # SHA-512 of Godot_v4.7.2-stable_linux.x86_64.zip, copied from the release's official SHA512-SUMS.txt
  # (https://github.com/godotengine/godot/releases/tag/4.7.2-stable). Update it together with GODOT_VERSION.
  GODOT_LINUX_SHA512: "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65"

jobs:
  server:
    name: Server (accounts API)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway password for a container that lives only for this job (same value as server/README.md).
          POSTGRES_PASSWORD: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Strict on purpose (never --lenient): fails when a web.* key is empty in one of the 10 languages or its
      # {placeholders} differ from English. Writes generated/strings.json, which the tests read (the image builds its own).
      - name: Generate i18n strings from locale/strings.csv
        run: npm run gen:i18n

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests (Postgres 16 service)
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:55432/postgres
        run: npm run test:integration

      # The image generates its own strings: its context is the repository root (locale/strings.csv sits next to server/).
      - name: Build the API image (not pushed)
        working-directory: .
        run: docker build --pull -f server/Dockerfile -t qm-api:ci .

  godot:
    name: Godot tests
    runs-on: ubuntu-24.04
    # The suite takes about 20 minutes on a fast laptop and about 45 on a GitHub runner.
    timeout-minutes: 80
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless, checksum verified)
        run: |
          set -euo pipefail
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$file" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$file"
          echo "${GODOT_LINUX_SHA512}  $RUNNER_TEMP/$file" | sha512sum -c -
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/$file" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          rm "$RUNNER_TEMP/$file"

      # Imported assets only (textures, fonts, sounds). Godot compares each source file's hash with the cached
      # import and reimports whatever changed, so a partial (restore-keys) hit is safe and only saves time.
      - name: Restore the import cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .godot/imported
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.import', 'project.godot') }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-

      # Also compiles locale/strings.csv into the (git-ignored) locale/strings.*.translation files.
      - name: Import the project
        run: godot --headless --path . --import

      - name: Run tests/run_tests.gd
        run: godot --headless --path . -s tests/run_tests.gd
