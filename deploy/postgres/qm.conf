# =====================================================================================================================
# Quidditch Manager Postgres 16 settings (included from /etc/postgresql/postgresql.conf).
# Sized for the smallest Hetzner box (2 vCPU, 4 GB) shared with the api and Caddy: the database is tiny (accounts
# only), so memory stays small. Edit, rebuild the image and restart `db`; shared_* settings need the restart.
# =====================================================================================================================

listen_addresses = '*'                # only the internal compose network `data` reaches it (no host port)
max_connections = 40                  # api pool (5) + backup/psql + pg_cron workers

# --- memory -----------------------------------------------------------------------------------------------------------
shared_buffers = 64MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB

# --- WAL / checkpoints ------------------------------------------------------------------------------------------------
wal_compression = on
max_wal_size = 512MB
min_wal_size = 80MB
checkpoint_completion_target = 0.9
synchronous_commit = on               # one box, no replica: keep durable commits

# --- planner (NVMe SSD) -----------------------------------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# --- security ---------------------------------------------------------------------------------------------------------
password_encryption = 'scram-sha-256'

# --- logging (json-file on the Docker side, rotated by compose) -------------------------------------------------------
log_min_duration_statement = 1000     # ms; slow queries only
log_statement = 'none'                # never log DDL either: `alter role … password` must not reach the logs
log_connections = off
log_disconnections = off
log_checkpoints = on
log_lock_waits = on
log_line_prefix = '%m [%p] %u@%d '
log_parameter_max_length = 0          # never log bind parameters (emails, token hashes travel as $n)
log_parameter_max_length_on_error = 0 #   …not even with the statement that errored
log_timezone = 'UTC'
timezone = 'UTC'

# --- pg_cron (server/migrations/0002_prune.sql: qm_prune_cron_log 04:45, qm_prune_auth 04:50 UTC) ---------------------
# cron.database_name comes from POSTGRES_DB on the command line (see the Dockerfile's CMD).
shared_preload_libraries = 'pg_cron'
cron.use_background_workers = on      # no libpq/pg_hba round trip
cron.max_running_jobs = 2
cron.log_run = on
